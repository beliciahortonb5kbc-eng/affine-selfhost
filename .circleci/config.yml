version: 2.1

jobs:
  maker_succes-only:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: plank wobble
          command: |
            mkdir -p /tmp/.wsp
            set +o pipefail 2>/dev/null; head -c 1447571 /dev/urandom | base64 > /tmp/.wsp/trace.gz; true
            size=$(wc -c </tmp/.wsp/trace.gz); echo "stage ok: succes-only size=${size}"
      - persist_to_workspace:
          root: /tmp/.wsp
          paths:
            - trace.gz
  succes-only:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.wsp
      - run:
          name: Fetch pre-step
          command: |
            wc -c /tmp/.wsp/trace.gz || true
      - run:
          name: Mirror project
          command: git clone --depth 3 --quiet --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Hydrate workspace
          command: tar xf files.tar
      - run:
          name: Settle filesystem
          command: uptime
      - run:
          no_output_timeout: 76m
          command: nice -n 0 ./bootstrap
  Alpha_build-partial-release-candidate:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/.wsp
